# Sample configuration for Evo2 feature analysis
# Run with: python -m src.explaining.run_evo2_analysis --config config/evo2_analysis.yaml

# Database settings
database:
  url: "postgresql://postgres:postgres@localhost:5432/explainable_evo"
  echo: false

# Model settings
model:
  name: "evo2_7b"
  layer_name: "blocks.6.mlp"
  device: "auto"  # auto, cuda, or cpu

# Autoencoder settings
autoencoder:
  expansion_factor: 8.0
  l1_coefficient: 1e-3
  tied_weights: false
  activation_threshold: 0.1
  max_features_per_sequence: 100
  epochs: 50
  learning_rate: 3e-4

# Processing settings
processing:
  batch_size: 16
  max_samples: 10000
  output_dir: "results"
  seed: 42
  verbose: true

# Feature set name (optional, defaults to {model.name}_{model.layer_name})
feature_set_name: "evo2_7b_blocks_6_mlp" 